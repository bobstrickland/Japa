name: Android CI/CD Pipeline

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      - name: Decode keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > my-release-key.jks

      - name: foo
        run: echo VERSION_CODE=${{ vars.VERSION_NUMBER }} > app/version.properties

      - name: Update GitHub Variable
        run: gh variable set VERSION_NUMBER --body ${{ vars.VERSION_NUMBER }}+1
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Build release AAB
        run: |
          ./gradlew bundleRelease
          

      - name: Sign AAB
        run: |
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore my-release-key.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
            -keypass ${{ secrets.KEY_PASSWORD }} \
            app/build/outputs/bundle/release/app-release.aab ${{ secrets.KEY_ALIAS }}


      #- name: Sign APK
      #  run: |
      #    jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256 \
      #      -keystore my-release-key.jks -storepass ${{ secrets.KEYSTORE_PASSWORD }} \
      #      -keypass ${{ secrets.KEY_PASSWORD }} \
      #      app/build/outputs/apk/release/app-release-unsigned.apk ${{ secrets.KEY_ALIAS }}

      - name: Verify signature
        run: |
          jarsigner -verify -verbose -certs app/build/outputs/bundle/release/app-release.aab
        #  jarsigner -verify -verbose -certs app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Align AAB
        run: |
          $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
            app/build/outputs/bundle/release/app-release.aab \
            app/build/outputs/bundle/release/app-release-signed.aab
        #  $ANDROID_HOME/build-tools/34.0.0/zipalign -v 4 \
        #    app/build/outputs/apk/release/app-release-unsigned.apk \
        #    app/build/outputs/apk/release/app-release.apk

      #- name: Upload Signed AAB
      #  uses: actions/upload-artifact@v4
      #  with:
      #    name: Signed-APK
      #    path: app/build/outputs/apk/release/app-release.apk

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: org.strickland.japa
          releaseFiles: app/build/outputs/bundle/release/app-release-signed.aab
          track: internal # Options: internal, alpha, beta, production
          status: draft
